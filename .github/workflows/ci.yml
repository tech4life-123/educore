name: CI

# Runs on every push and pull request against main, so a change that breaks
# lint, types, the build or the AI unit tests is caught before it reaches
# Vercel's auto-deploy — not just when someone remembers to run `npm run
# check` by hand.
#
# No secrets are needed: the build and tests do not require real Supabase or
# Anthropic credentials (verified — `npm run check` passes with no env vars
# set; RLS and database behaviour are covered separately by the SQL suites
# in supabase/tests/, which run against the live project and are not part of
# this workflow).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build, AI unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck and build
        run: npm run check

      - name: AI unit tests
        run: npm run test:ai
